name: Sync Renewlet Upstream Automatically

on:
  schedule:
    # 每天北京时间 10:00 自动检查上游更新
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renewlet-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zhiyingzzhou/renewlet.git || true
          git fetch upstream main

          git checkout main
          git merge upstream/main --no-edit || {
            echo "Upstream merge conflict detected, stop automatic sync."
            exit 1
          }

          git push origin main
