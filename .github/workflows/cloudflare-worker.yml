name: Cloudflare Worker

# fork 用户和维护者测试环境共用的自管部署入口；缺少 secrets 时只跳过远端部署，仍保留构建验证。
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      healthcheck_url:
        description: Optional URL to probe after a remote deployment. Overrides HEALTHCHECK_URL.
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Commit SHA or ref to build and deploy. Defaults to the triggering revision.
        required: false
        default: ''
        type: string
      deployment_reason:
        description: Human-readable reason included in the deployment notification.
        required: false
        default: Upstream synchronization
        type: string
      healthcheck_url:
        description: Optional URL to probe after a remote deployment. Overrides HEALTHCHECK_URL.
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      WORKER_NAME:
        required: false
      D1_DATABASE_ID:
        required: false
      R2_BUCKET_NAME:
        required: false
      HEALTHCHECK_URL:
        required: false
      DINGTALK_WEBHOOK:
        required: false
      DINGTALK_SIGNING_SECRET:
        required: false

permissions:
  contents: read

concurrency:
  # 同一仓库的 D1 migration/backfill/deploy 是一个不可中断序列；新 push 只能排队，不能取消正在写库的 run。
  group: cloudflare-worker-${{ github.repository }}
  cancel-in-progress: false

env:
  CI_WRANGLER_CONFIG: wrangler.generated.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: ${{ secrets.WORKER_NAME }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  CLOUDFLARE_OBSERVABILITY_PROFILE: development
  RENEWLET_COMMIT: ${{ inputs.source_ref || github.sha }}

jobs:
  deploy:
    # 官方生产 Worker 只能由 Release Publish 的 tag job 覆盖；自管入口在官方仓库只跑 dev，fork/main 仍保留同步部署路径。
    if: ${{ github.repository != 'zhiyingzzhou/renewlet' || github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      remote_deploy_ready: ${{ steps.deployment-secrets.outputs.ready }}
      healthcheck_status: ${{ steps.healthcheck.outputs.status }}
      revision: ${{ steps.revision.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          DEPLOY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${DEPLOY_SHA::7}"
          {
            echo "RENEWLET_VERSION=${PACKAGE_VERSION}-dev+${SHORT_SHA}"
            echo "RENEWLET_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare build
        run: pnpm check:cloudflare

      - name: Build Cloudflare assets
        run: pnpm build:cloudflare

      - name: Check deployment secrets
        id: deployment-secrets
        shell: bash
        # fork/私有测试环境常缺远端 secrets；这里降级为 notice，保留构建检查但不碰真实 D1/R2。
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORKER_NAME D1_DATABASE_ID R2_BUCKET_NAME; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list="${missing_list%, }"
            echo "::notice title=Cloudflare deploy skipped::Missing GitHub Actions secrets: ${missing_list}. Build checks passed; add all required secrets to enable remote D1 migration and Worker deploy."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate Cloudflare config
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm cloudflare:config:ci

      # checkpoint 必须先于任何远端写入；后续失败只引用该证据，不自动执行破坏性恢复。
      - name: Capture D1 Time Travel checkpoint
        id: d1-checkpoint
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm exec tsx scripts/cloudflare-d1-checkpoint.ts capture --config "$CI_WRANGLER_CONFIG"

      - name: Apply D1 migrations
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm cloudflare:migrations:apply --config "$CI_WRANGLER_CONFIG"

      - name: Ensure Cloudflare Queues
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm cloudflare:queues:ensure

      - name: Deploy Worker
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --config "$CI_WRANGLER_CONFIG"

      - name: Health check deployed service
        id: healthcheck
        if: steps.deployment-secrets.outputs.ready == 'true'
        env:
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url || secrets.HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice title=Health check skipped::Set HEALTHCHECK_URL or provide the workflow input to enable post-deploy probing."
            exit 0
          fi

          if curl --fail --silent --show-error --location --retry 2 --retry-connrefused --max-time 30 "$HEALTHCHECK_URL" --output /dev/null; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report manual D1 recovery command
        if: ${{ failure() && steps.deployment-secrets.outputs.ready == 'true' && steps.d1-checkpoint.outputs.bookmark != '' }}
        env:
          D1_TIME_TRAVEL_BOOKMARK: ${{ steps.d1-checkpoint.outputs.bookmark }}
        run: pnpm exec tsx scripts/cloudflare-d1-checkpoint.ts recovery-hint --config "$CI_WRANGLER_CONFIG"

  notify:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SIGNING_SECRET: ${{ secrets.DINGTALK_SIGNING_SECRET }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REMOTE_DEPLOY_READY: ${{ needs.deploy.outputs.remote_deploy_ready }}
          HEALTHCHECK_STATUS: ${{ needs.deploy.outputs.healthcheck_status }}
          REVISION: ${{ needs.deploy.outputs.revision || github.sha }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason || 'Direct branch update' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DINGTALK_WEBHOOK" || -z "$DINGTALK_SIGNING_SECRET" ]]; then
            echo "::notice title=DingTalk notification skipped::Set DINGTALK_WEBHOOK and DINGTALK_SIGNING_SECRET to enable deployment notifications."
            exit 0
          fi

          if [[ "$DEPLOY_RESULT" != "success" ]]; then
            title="Renewlet 部署失败"
            icon="❌"
            detail="请查看 GitHub Actions 日志。"
          elif [[ "$REMOTE_DEPLOY_READY" != "true" ]]; then
            title="Renewlet 部署已跳过"
            icon="⚠️"
            detail="Cloudflare 所需 Secret 未配置完整；构建检查仍已执行。"
          else
            title="Renewlet 部署成功"
            icon="🚀"
            case "$HEALTHCHECK_STATUS" in
              passed) detail="Cloudflare 已更新，健康检查通过。" ;;
              skipped|"") detail="Cloudflare 已更新；未配置 HEALTHCHECK_URL，因此未执行健康检查。" ;;
              *) detail="Cloudflare 已更新。" ;;
            esac
          fi

          message="$(printf '### %s %s\n\n%s\n\n- 原因：%s\n- 版本：`%s`\n- [查看执行详情](%s)' \
            "$icon" "$title" "$detail" "$DEPLOYMENT_REASON" "${REVISION:0:12}" "$RUN_URL")"
          payload=$(jq -nc --arg title "$title" --arg text "$message" '{msgtype: "markdown", markdown: {title: $title, text: $text}}')
          timestamp="$(date +%s000)"
          signature=$(printf '%s\n%s' "$timestamp" "$DINGTALK_SIGNING_SECRET" | openssl dgst -sha256 -hmac "$DINGTALK_SIGNING_SECRET" -binary | base64 | tr -d '\n')
          encoded_signature=$(jq -rn --arg value "$signature" '$value | @uri')
          separator='?'
          [[ "$DINGTALK_WEBHOOK" == *'?'* ]] && separator='&'

          curl --fail --silent --show-error --request POST \
            "${DINGTALK_WEBHOOK}${separator}timestamp=${timestamp}&sign=${encoded_signature}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output /dev/null
