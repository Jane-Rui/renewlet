name: CI

# 分支质量门只覆盖 dev push；main 稳定线靠 release PR 与 tag workflow 守门，避免合并后重复跑整套 CI。
on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Docker 与发布继续固定 Node 24 LTS；Node 26 lane 只验证贡献者环境兼容性，不扩大到 EOL 奇数版或未来主版本。
      matrix:
        node-version: ["24.19.0", "26.5.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/docker-server/go.mod
          cache-dependency-path: apps/docker-server/go.sum

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check file length guard
        run: pnpm check:file-lines

      - name: Check deploy config
        run: pnpm check:deploy

      - name: Check Public API docs
        run: pnpm check:public-api-docs

      - name: Lint frontends
        run: pnpm lint

      - name: Check i18n catalogs
        run: pnpm --filter @renewlet/client i18n:check

      - name: Typecheck
        run: pnpm typecheck:all

      - name: Build all workspaces
        # 客户端 build 同时执行 manifest gzip/brotli 预算；其余 workspace 与 Go module 也必须实际产出。
        run: pnpm build:all

      - name: Check product route parity
        run: pnpm check:route-parity

      - name: Test unit suites
        run: pnpm test:unit

      - name: Check performance operation budgets
        # 操作数是稳定硬门；耗时、RSS 和分配量只由各测试输出趋势，不设共享 runner 阈值。
        run: pnpm test:perf

      - name: Check Cloudflare build path
        # 只做类型和构建前检查，避免普通分支 CI 触发 D1 migration 或 Worker 部署副作用。
        run: pnpm check:cloudflare
