

name: Sync Renewlet Upstream

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动检查上游更新
    - cron: "0 2 * * *"→ Runs at 02:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # 这个 workflow 会出现在 Cloudflare Deploy Button 生成仓库里；官方源仓库不能反向同步自己。
    if: ${{ github.repository != 'zhiyingzzhou/renewlet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync-step.outputs.changed }}
      upstream_sha: ${{ steps.sync-step.outputs.upstream_sha }}
      revision: ${{ steps.sync-step.outputs.revision }}
    steps:
      - name: Checkout generated repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync upstream tree
        id: sync-step
        shell: bash
